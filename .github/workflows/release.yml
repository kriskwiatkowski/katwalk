name: Release Build

on:
  push:
    tags:
      - "v*.*.*"
      - "katwalk-v*.*.*"
  workflow_dispatch:
    inputs:
      version:
        description: "Version tag (e.g., v1.6.7)"
        required: true
        default: "v1.6.7"

env:
  CARGO_TERM_COLOR: always

jobs:
  build-release:
    name: Build Release - ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            artifact_name: katwalk
            asset_name: katwalk-linux-x86_64
          - os: ubuntu-latest
            target: x86_64-unknown-linux-musl
            artifact_name: katwalk
            asset_name: katwalk-linux-x86_64-musl
          - os: macos-latest
            target: x86_64-apple-darwin
            artifact_name: katwalk
            asset_name: katwalk-macos-x86_64
          - os: macos-latest
            target: aarch64-apple-darwin
            artifact_name: katwalk
            asset_name: katwalk-macos-aarch64
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            artifact_name: katwalk.exe
            asset_name: katwalk-windows-x86_64.exe

    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - name: Install musl tools (Linux musl only)
        if: matrix.target == 'x86_64-unknown-linux-musl'
        run: |
          sudo apt-get update
          sudo apt-get install -y musl-tools
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-release-${{ matrix.target }}-${{ hashFiles('Cargo.lock') }}
      - run: cargo build --release --target ${{ matrix.target }}
      - name: Strip binary (Unix)
        if: matrix.os != 'windows-latest'
        run: strip target/${{ matrix.target }}/release/${{ matrix.artifact_name }}
      - name: Create checksum
        shell: bash
        run: |
          cd target/${{ matrix.target }}/release
          sha256sum ${{ matrix.artifact_name }} > ${{ matrix.asset_name }}.sha256
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.asset_name }}
          path: target/${{ matrix.target }}/release/${{ matrix.artifact_name }}
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.asset_name }}.sha256
          path: target/${{ matrix.target }}/release/${{ matrix.asset_name }}.sha256

  create-release:
    name: Create Release
    needs: build-release
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: ./artifacts
      - name: Display structure
        run: ls -R ./artifacts
      - name: Create Release
        uses: ncipollo/release-action@v1
        with:
          artifacts: "artifacts/**/*"
          token: ${{ secrets.GITHUB_TOKEN }}
          draft: false
          prerelease: false
          generateReleaseNotes: true
          body: |
            ## katwalk Release ${{ github.ref_name }}

            ### Downloads

            Choose the appropriate binary for your platform:

            - **Linux (glibc)**: `katwalk-linux-x86_64`
            - **Linux (musl)**: `katwalk-linux-x86_64-musl` (static, no dependencies)
            - **macOS (Intel)**: `katwalk-macos-x86_64`
            - **macOS (Apple Silicon)**: `katwalk-macos-aarch64`
            - **Windows**: `katwalk-windows-x86_64.exe`

            ### Verification

            Verify your download with the provided SHA256 checksums:
            ```bash
            sha256sum -c katwalk-linux-x86_64.sha256
            ```

            ### Installation

            Linux/macOS:
            ```bash
            chmod +x katwalk-*
            sudo mv katwalk-* /usr/local/bin/katwalk
            ```
