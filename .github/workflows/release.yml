name: Release Build

on:
  push:
    tags:
      - "v*.*.*"
      - "katwalk-v*.*.*"
  workflow_dispatch:
    inputs:
      version:
        description: "Version tag (e.g., v1.6.7)"
        required: true
        default: "v1.6.7"

env:
  CARGO_TERM_COLOR: always

jobs:
  build-release:
    name: Build Release - ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          # Linux builds use musl so the binary is fully static (no glibc dependency).
          - os: ubuntu-latest
            target: x86_64-unknown-linux-musl
            artifact_name: katwalk
            asset_name: katwalk-linux-x86_64
          - os: ubuntu-latest
            target: aarch64-unknown-linux-musl
            artifact_name: katwalk
            asset_name: katwalk-linux-aarch64
            cross: true
          - os: macos-latest
            target: x86_64-apple-darwin
            artifact_name: katwalk
            asset_name: katwalk-macos-x86_64
          - os: macos-latest
            target: aarch64-apple-darwin
            artifact_name: katwalk
            asset_name: katwalk-macos-aarch64
          # Windows builds statically link the CRT so no vcruntime DLLs are required.
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            artifact_name: katwalk.exe
            asset_name: katwalk-windows-x86_64.exe
            rustflags: "-C target-feature=+crt-static"
          - os: windows-latest
            target: aarch64-pc-windows-msvc
            artifact_name: katwalk.exe
            asset_name: katwalk-windows-aarch64.exe
            rustflags: "-C target-feature=+crt-static"

    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - name: Install musl tools (Linux musl, native only)
        if: matrix.target == 'x86_64-unknown-linux-musl'
        run: |
          sudo apt-get update
          sudo apt-get install -y musl-tools
      - name: Install cross
        if: matrix.cross
        uses: taiki-e/install-action@v2
        with:
          tool: cross
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-release-${{ matrix.target }}-${{ hashFiles('Cargo.lock') }}
      - name: Build
        if: '!matrix.cross'
        run: cargo build --release --target ${{ matrix.target }}
        env:
          RUSTFLAGS: ${{ matrix.rustflags }}
      - name: Build (cross)
        if: matrix.cross
        run: cross build --release --target ${{ matrix.target }}
      - name: Create zip archive (Unix)
        if: matrix.os != 'windows-latest'
        shell: bash
        run: |
          cd target/${{ matrix.target }}/release
          zip ${{ matrix.asset_name }}.zip ${{ matrix.artifact_name }}
      - name: Create zip archive (Windows)
        if: matrix.os == 'windows-latest'
        shell: pwsh
        run: |
          Compress-Archive -Path target/${{ matrix.target }}/release/${{ matrix.artifact_name }} -DestinationPath target/${{ matrix.target }}/release/${{ matrix.asset_name }}.zip
      - name: Create checksum
        shell: bash
        run: |
          cd target/${{ matrix.target }}/release
          sha256sum ${{ matrix.asset_name }}.zip > ${{ matrix.asset_name }}.zip.sha256
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.asset_name }}.zip
          path: target/${{ matrix.target }}/release/${{ matrix.asset_name }}.zip
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.asset_name }}.zip.sha256
          path: target/${{ matrix.target }}/release/${{ matrix.asset_name }}.zip.sha256

  create-release:
    name: Create Release
    needs: build-release
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: ./artifacts
      - name: Display structure
        run: ls -R ./artifacts
      - name: Create Release
        uses: ncipollo/release-action@v1
        with:
          artifacts: "artifacts/**/*"
          token: ${{ secrets.GITHUB_TOKEN }}
          draft: false
          prerelease: false
          generateReleaseNotes: true
          body: |
            ## katwalk Release ${{ github.ref_name }}

            ### Downloads

            All binaries are statically linked and have no external runtime dependencies.

            - **Linux (x86_64)**: `katwalk-linux-x86_64.zip`
            - **Linux (arm64)**: `katwalk-linux-aarch64.zip`
            - **macOS (Intel)**: `katwalk-macos-x86_64.zip`
            - **macOS (Apple Silicon)**: `katwalk-macos-aarch64.zip`
            - **Windows (x86_64)**: `katwalk-windows-x86_64.exe.zip`
            - **Windows (arm64)**: `katwalk-windows-aarch64.exe.zip`

            ### Verification

            Verify your download with the provided SHA256 checksums:
            ```bash
            sha256sum -c katwalk-linux-x86_64.zip.sha256
            ```

            ### Installation

            Linux/macOS:
            ```bash
            unzip katwalk-linux-x86_64.zip
            chmod +x katwalk
            sudo mv katwalk /usr/local/bin/katwalk
            ```
